name: Sync GitHub Contributions

on:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/github.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: pranavv1210
        run: node scripts/fetch-github.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/github.json; then
            echo "Contribution data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          git commit -m "chore: update GitHub contribution data"
          git push
